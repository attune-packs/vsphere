ref: vsphere.guest_file
label: "Manage Guest File"
description: "Upload, download, or delete one guest file with separate credentials and confined local artifacts"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: vsphere_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  profile_key: {type: string, default: vsphere.vcenter, required: true, description: "Pack-owned encrypted vCenter profile Key ref"}
  guest_credential_key: {type: string, default: vsphere.guest, required: true, description: "Separate encrypted guest username/password Key ref"}
  operation: {type: string, required: true, enum: [upload, download, delete]}
  vm_moid: {type: string, required: true}
  guest_path: {type: string, required: true}
  artifact_path: {type: string, description: "Relative path beneath ATTUNE_ARTIFACTS_DIR for upload/download"}
  overwrite: {type: boolean, default: false}
  confirmation: {type: string, description: "Exact DELETE_GUEST_FILE or OVERWRITE_GUEST_FILE confirmation"}
  transfer_timeout_seconds: {type: integer, default: 300, minimum: 1, maximum: 1800}
output:
  operation: {type: string}
  data: {type: object}
  meta: {type: object}
tags: [vsphere, vm, guest, file, artifact]
