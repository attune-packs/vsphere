ref: vsphere.tag
label: "Manage Tag"
description: "List, create, or explicitly delete current vSphere Automation API tags"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: vsphere_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  profile_key: {type: string, default: vsphere.vcenter, required: true, description: "Pack-owned encrypted vCenter profile Key ref"}
  operation: {type: string, required: true, enum: [list, create, delete]}
  tag_id: {type: string}
  category_id: {type: string}
  name: {type: string}
  description: {type: string, default: ""}
  confirmation: {type: string, description: "Exact DELETE_TAG confirmation required for delete"}
output:
  operation: {type: string}
  data: {type: any}
  meta: {type: object}
tags: [vsphere, tag]
