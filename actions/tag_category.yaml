ref: vsphere.tag_category
label: "Manage Tag Category"
description: "List, create, or explicitly delete current vSphere Automation API tag categories"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: vsphere_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  profile_key: {type: string, default: pack.vsphere.vcenter, required: true, description: "Pack-owned encrypted vCenter profile Key ref"}
  operation: {type: string, required: true, enum: [list, create, delete]}
  category_id: {type: string}
  name: {type: string}
  description: {type: string, default: ""}
  cardinality: {type: string, enum: [SINGLE, MULTIPLE], default: SINGLE}
  associable_types: {type: array, default: [], items: {type: string}}
  confirmation: {type: string, description: "Exact DELETE_CATEGORY confirmation required for delete"}
output:
  operation: {type: string}
  data: {type: any}
  meta: {type: object}
tags: [vsphere, tag, category]
