ref: vsphere.guest_process
label: "Manage Guest Process"
description: "Start or inspect one guest process using a separate guest credential Key"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: vsphere_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  profile_key: {type: string, default: vsphere.vcenter, required: true, description: "Pack-owned encrypted vCenter profile Key ref"}
  guest_credential_key: {type: string, default: vsphere.guest, required: true, description: "Separate encrypted guest username/password Key ref"}
  operation: {type: string, required: true, enum: [start, status]}
  vm_moid: {type: string, required: true}
  program_path: {type: string}
  arguments: {type: string, default: "", secret: true}
  working_directory: {type: string, default: ""}
  environment: {type: array, default: [], items: {type: string}, secret: true}
  pid: {type: integer, minimum: 1}
output:
  operation: {type: string}
  data: {type: object}
  meta: {type: object}
tags: [vsphere, vm, guest, process]
