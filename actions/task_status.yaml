ref: vsphere.task_status
label: "Get vSphere Task Status"
description: "Inspect or bounded-poll one task MOID without a durable sensor or implicit retry"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: vsphere_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  profile_key: {type: string, default: vsphere.vcenter, required: true, description: "Pack-owned encrypted vCenter profile Key ref"}
  task_moid: {type: string, required: true}
  wait_seconds: {type: integer, default: 0, minimum: 0, maximum: 300}
  poll_interval_seconds: {type: integer, default: 2, minimum: 1, maximum: 10}
output:
  operation: {type: string}
  data: {type: object}
  meta: {type: object}
tags: [vsphere, task, status]
