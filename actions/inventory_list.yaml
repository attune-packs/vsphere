ref: vsphere.inventory_list
label: "List vSphere Inventory"
description: "Discover datacenters, clusters, hosts, datastores, networks, or folders with MOIDs and explicit paths"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: vsphere_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  profile_key: {type: string, default: vsphere.vcenter, required: true, description: "Pack-owned encrypted vCenter profile Key ref"}
  kind: {type: string, required: true, enum: [datacenter, cluster, host, datastore, network, folder]}
  path_prefix: {type: string, description: "Absolute inventory path prefix"}
  limit: {type: integer, default: 1000, minimum: 1, maximum: 5000}
output:
  operation: {type: string}
  data: {type: array, items: {type: object}}
  meta: {type: object}
tags: [vsphere, inventory, discovery]
